name: BDDPlaywright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run BDD Tests
    runs-on: ubuntu-24.04   # Pinned to Ubuntu 24.04 to fix the ubuntu-latest migration notice
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4   # Updated standard release version

      - name: Setup Node.js
        uses: actions/setup-node@v4  # Updated standard release version
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run BDD tests
        run: ENV=dev npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4   # Replaced v5 with v4 to resolve the internal Node 20 warning target mismatch
        with:
          name: bdd-test-results
          path: |
            allure-results/
            allure-report/
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14
